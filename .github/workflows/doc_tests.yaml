name: Doc Tests
on:
#  push:
  pull_request:
    branches:
      - develop
      - 'release/*'
  workflow_dispatch:

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  doc_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install package dependencies
        run: sudo apt-get update --yes && sudo apt-get install --yes plantuml
      - name: Checkout repository
        uses: actions/checkout@v4
      # Use the same Python version as Read the Docs (.readthedocs.yaml).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Install the pinned versions in doc/requirements.txt, which Read the
      # Docs also uses, so that both build the documentation the same way.
      - name: Setup Sphinx build
        run: |
          python -m pip install -r doc/requirements.txt
          python --version
          sphinx-build --version

#      - name: Check tech docs
#        run: .github/scripts/check_tech_doc.sh
      - name: Build documentation
        run: |
          cd doc
          make clean && make html
#      - name: Check links
#        if: ${{ !cancelled() }}
#        run: |
#          cd doc
#          make linkcheck
