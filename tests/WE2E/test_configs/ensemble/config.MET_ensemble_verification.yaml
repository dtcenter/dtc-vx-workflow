metadata:
  description: |-
    This test ensures the MET ensemble-specific tasks run successfully with
    two members and one of the built-in custom verification masks.
workflow:
  DATE_FIRST_CYCL: '2021051212'
  DATE_LAST_CYCL: '2021051212'
  FCST_LEN_HRS: 6
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/verify_pre.yaml
    - parm/wflow/verify_det.yaml
    - parm/wflow/verify_ens.yaml
ensemble:
  DO_ENSEMBLE: true
  NUM_ENS_MEMBERS: 2
verification:
  VX_MASK: ["AZCA"]
  VX_FCST_MODEL_NAME: srw.RRFS_CONUS_25km
  VX_FCST_INPUT_BASEDIR: '{{ platform.STAGED_DATA }}/MET_ensemble_verification'
  FCST_FN_TEMPLATE: 'srw.t{init?fmt=%H?shift=-${time_lag}}z.prslev.f{lead?fmt=%HHH?shift=${time_lag}}.rrfs_conus_25km.grib2'
