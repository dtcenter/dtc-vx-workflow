metadata:
  description: |-
    This test checks the capability of the workflow to run ensemble verification
    tasks with 10 members. This also serves as a winter snowstorm case for
    checking ensemble snowfall verification statistics.
workflow:
  DATE_FIRST_CYCL: '2022020300'
  DATE_LAST_CYCL: '2022020300'
  FCST_LEN_HRS: 6
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/verify_pre.yaml
    - parm/wflow/verify_det.yaml
    - parm/wflow/verify_ens.yaml
ensemble:
  DO_ENSEMBLE: true
  NUM_ENS_MEMBERS: 10
verification:
  VX_FCST_MODEL_NAME: srw.RRFS_CONUScompact_25km
  VX_FIELD_GROUPS: [ "APCP", "ASNOW", "REFC", "RETOP", "SFC", "UPA" ]
  OBS_NOHRSC_FN_TEMPLATES: [ 'ASNOW',
                             '{valid?fmt=%Y%m%d}/sfav2_CONUS_{{ "%02d" % verification.NOHRSC_OBS_AVAIL_INTVL_HRS }}h_{valid?fmt=%Y%m%d%H}_grid184.grb2' ]
  VX_FCST_INPUT_BASEDIR: '{{ platform.STAGED_DATA }}/MET_ensemble_verification_winter_wx'
  VX_TASKS: 4
  VX_MASK: ["CONUS"]
  FCST_FN_TEMPLATE: 'srw.t{init?fmt=%H?shift=-${time_lag}}z.prslev.f{lead?fmt=%HHH?shift=${time_lag}}.rrfs_conuscompact_25km.grib2'

