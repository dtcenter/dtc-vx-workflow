metadata:
  description: |-
    This is a simple test for MET deterministic verification of a global
    forecast (GFS) against GDAS (Global Data Assimilation System) obs.
    The GDAS obs are retrieved from HPSS.
workflow:
  DATE_FIRST_CYCL: '2026030100'
  DATE_LAST_CYCL: '2026030100'
  FCST_LEN_HRS: 6
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/get_obs.yaml
    - parm/wflow/preprocessing.yaml
    - parm/wflow/verify_det.yaml
verification:
  # Verify SFC/UPA fields against GDAS (not NDAS) obs.
  VX_OBTYPE_SFC_UPA: "GDAS"
  #
  # Base directory in which to look for obs.  If it does not exist and/or
  # does not contain the required obs, create and populate it.
  # Note that when performing WE2E tests, the default behavior is not to
  # get obs files from HPSS but to use staged obs files.  This is done by
  # setting this variable to the (platform-specific) location of these
  # staged files.  To force the WE2E testing system to get the obs from
  # HPSS, here we reset this variable to its default value in the workflow
  # configuration file config_defaults.yaml.
  GDAS_OBS_DIR: "{{ workflow.EXPTDIR }}/obs_data/gdas"
  # Do not remove raw obs files to be able to verify that only the necessary
  # raw files are fetched from HPSS.
  REMOVE_RAW_OBS_DIRS: false
  #
  VX_FCST_MODEL_NAME: gfs
  VX_FCST_OUTPUT_INTVL_HRS: 6
  VX_FCST_INPUT_BASEDIR: '/scratch3/BMC/dtc/dtc-vx-workflow_testing/vx_test_data_global_tmp'
  FCST_SUBDIR_TEMPLATE: ''
  FCST_FN_TEMPLATE: '{{verification.VX_FCST_MODEL_NAME.upper()}}/{init?fmt=%Y}/{init?fmt=%Y%m%d}/{{verification.VX_FCST_MODEL_NAME.lower()}}.0p25.{init?fmt=%Y%m%d%H}.f{lead?fmt=%HHH?shift=${time_lag}}.grib2'
  #
  # NCEP 1x1-degree daily climatology (mean and standard deviation), used
  # for anomaly statistics.
  VX_CLIMO_MEAN_INPUT_DIR: '{{ verification.VX_FCST_INPUT_BASEDIR }}/NCEP_climo'
  VX_CLIMO_MEAN_INPUT_TEMPLATE: 'cmean_1d.1979{valid?fmt=%m%d}'
  VX_CLIMO_STDEV_INPUT_DIR: '{{ verification.VX_FCST_INPUT_BASEDIR }}/NCEP_climo'
  VX_CLIMO_STDEV_INPUT_TEMPLATE: 'cstdv_1d.1979{valid?fmt=%m%d}'
  #
  VX_FIELD_GROUPS: [ "SFC", "UPA" ]
fields:
  #
  SFC:
    - fcst_name: TMP
      fcst_levels: [Z2]
      fcst_thresholds: []
    #
    - fcst_name: DPT
      fcst_levels: [Z2]
      fcst_thresholds: []
    #
    - fcst_name: UGRD
      fcst_levels: [Z10]
      fcst_thresholds: []
      fcst_options: 'is_u_wind = TRUE;'
      obs_options: 'is_u_wind = TRUE;'
    #
    - fcst_name: VGRD
      fcst_levels: [Z10]
      fcst_thresholds: []
      fcst_options: 'is_v_wind = TRUE;'
      obs_options: 'is_v_wind = TRUE;'
    #
    - fcst_name: PRMSL
      fcst_levels: [L0]
      fcst_thresholds: []
  #
  UPA:
    - fcst_name: TMP
      fcst_levels: [P850]
      fcst_thresholds: []
    #
    - fcst_name: SPFH
      fcst_levels: [P850, P700]
      fcst_thresholds: []
    #
    - fcst_name: UGRD
      fcst_levels: [P850, P500, P250]
      fcst_thresholds: []
      fcst_options: 'is_u_wind = TRUE;'
      obs_options: 'is_u_wind = TRUE;'
    #
    - fcst_name: VGRD
      fcst_levels: [P850, P500, P250]
      fcst_thresholds: []
      fcst_options: 'is_v_wind = TRUE;'
      obs_options: 'is_v_wind = TRUE;'
    #
    - fcst_name: HGT
      fcst_levels: [P700, P500, P250]
      fcst_thresholds: []
