metadata:
  description: |-
    This is a basic test for deterministic verification with staged observations and
    specified verification masks.

workflow:
  DATE_FIRST_CYCL: '2019061500'
  DATE_LAST_CYCL: '2019061500'
  FCST_LEN_HRS: 6
  PREEXISTING_DIR_METHOD: rename
  taskgroups:
    - parm/wflow/verify_pre.yaml
    - parm/wflow/verify_det.yaml

verification:
  VX_MASK: ["CONUS","EAST","EAST_OF_ROCKIES"]
  VX_FCST_MODEL_NAME: srw.RRFS_CONUS_25km
  VX_FCST_INPUT_BASEDIR: '{{ platform.STAGED_DATA }}/output_data/fcst_det/RRFS_CONUS_25km'
  FCST_FN_TEMPLATE: 'rrfs.t{init?fmt=%H?shift=-${time_lag}}z.prslev.f{lead?fmt=%HHH?shift=${time_lag}}.rrfs_conus_25km.grib2'
