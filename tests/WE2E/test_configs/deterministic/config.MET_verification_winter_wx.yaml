metadata:
  description: |-
    This test checks the capability of the workflow to run verification tasks
    on a user-specified grid. This also serves as a winter snowstorm case for
    checking snowfall verification statistics using observations retrieved from
    HPSS, using specified verification mask regions
workflow:
  GRID_GEN_METHOD: ESGgrid
  DATE_FIRST_CYCL: '2023021700'
  DATE_LAST_CYCL: '2023021700'
  FCST_LEN_HRS: 6
  PREEXISTING_DIR_METHOD: rename
verification:
  VX_FIELD_GROUPS:
    - APCP
    - REFC
    - RETOP
    - ASNOW
  VX_MASK: ["CONUS","ECA"]
  CCPA_OBS_DIR: '{{ workflow.EXPTDIR }}/CCPA_obs'
  MRMS_OBS_DIR: '{{ workflow.EXPTDIR }}/MRMS_obs'
  NDAS_OBS_DIR: '{{ workflow.EXPTDIR }}/NDAS_obs'
  NOHRSC_OBS_DIR: '{{ workflow.EXPTDIR }}/NOHRSC_obs'
  VX_FCST_MODEL_NAME: custom_ESGgrid_Michigan_Ontario
  VX_FCST_INPUT_BASEDIR: '{{ platform.STAGED_DATA }}/MET_verification_winter_wx'
  FCST_FN_TEMPLATE: '{init?fmt=%Y%m%d%H?shift=-${time_lag}}/postprd/srw.t{init?fmt=%H?shift=-${time_lag}}z.prslev.f{lead?fmt=%HHH?shift=${time_lag}}.{{ verification.VX_FCST_MODEL_NAME }}.grib2'

