# An example of a WE2E status file, WE2E_status_<datetime>.yaml.  No script
# reads this example.
#
# run_we2e_tests.py writes a status file for each set of WE2E tests it runs,
# in the directory it is run from; <datetime> is when it was launched.  While
# the tests run, monitor_jobs.py rewrites the file with the current status of
# each experiment and of each of its tasks.  The file has one entry per
# experiment, named <test name>_<datetime>.
#
# This example shows a set of five tests partway through its run, with each
# experiment in a different state:
#
#   MET_verification_only_vx           COMPLETE:   all its tasks succeeded
#   MET_ensemble_verification_only_vx  RUNNING:    some tasks are running
#   MET_verification_winter_wx         SUBMITTING: its first tasks were just
#                                                  submitted
#   HAFS-A                             QUEUED:     its first task is waiting
#                                                  in the batch queue
#   MODE_AOD                           DEAD:       a task failed
#
# Right after run_we2e_tests.py generates the experiments, before monitoring
# starts, every experiment is CREATED and has no task entries.
#
# Each task entry is named <task>_<cycle>, with the cycle as YYYYMMDDHHMM, and
# holds the task's status, its number of cores and its walltime in seconds, as
# recorded by Rocoto.  Only tasks that Rocoto has submitted have entries.  An
# experiment gets a walltime entry when it finishes.  At the end of the run,
# monitor_jobs.py also adds core_hours and exact_count to each task entry.
#
### WARNING ###
### THIS FILE IS AUTO_GENERATED AND REGULARLY OVER-WRITTEN BY WORKFLOW SCRIPTS
### EDITS MAY RESULT IN MISBEHAVIOR OF EXPERIMENTS RUNNING
