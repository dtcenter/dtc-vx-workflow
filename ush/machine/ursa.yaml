platform:
  WORKFLOW_MANAGER: rocoto
  NCORES_PER_NODE: 192
  SCHED: slurm
  WE2E_TEST_DATA: /scratch3/NCEPDEV/nems/role.epic/ursa/UFS_SRW_data/develop
  TEST_CCPA_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/ccpa/proc'
  TEST_NOHRSC_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/nohrsc/proc'
  TEST_MRMS_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/mrms/proc'
  TEST_NDAS_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/ndas/proc'
  TEST_AERONET_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/aeronet'
  TEST_AIRNOW_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/airnow'
  TEST_GDAS_OBS_DIR: '{{ platform.WE2E_TEST_DATA }}/obs_data/gdas'
  QUEUE_DEFAULT: batch
  QUEUE_FCST: batch
  PARTITION_DEFAULT: u1-compute
  PARTITION_FCST: u1-compute
  PARTITION_HPSS: u1-service
  EXCLUSIVE: exclusive
  QUEUE_HPSS: batch
  RUN_CMD_FCST: srun --export=ALL
  RUN_CMD_POST: srun --export=ALL
  RUN_CMD_PRDGEN: srun --export=ALL
  RUN_CMD_SERIAL: time
  RUN_CMD_UTILS: srun --export=ALL
  RUN_CMD_NEXUS: srun -n ${nprocs} --export=ALL
  SCHED_NATIVE_CMD: "--export=NONE"
  SCHED_NATIVE_CMD_HPSS: "-n 1 --export=NONE"
  PRE_TASK_CMDS: '{ ulimit -s unlimited; ulimit -a; }'
  TEST_EXTRN_MDL_SOURCE_BASEDIR: /scratch3/NCEPDEV/nems/role.epic/ursa/UFS_SRW_data/develop/input_model_data
  TEST_ALT_EXTRN_MDL_SYSBASEDIR_ICS: /scratch3/NCEPDEV/nems/role.epic/ursa/UFS_SRW_data/develop/dummy_FV3GFS_sys_dir
  TEST_ALT_EXTRN_MDL_SYSBASEDIR_LBCS: /scratch3/NCEPDEV/nems/role.epic/ursa/UFS_SRW_data/develop/dummy_FV3GFS_sys_dir
  TEST_VX_FCST_INPUT_BASEDIR: '{{ "/scratch3/NCEPDEV/nems/role.epic/ursa/UFS_SRW_data/develop/output_data/fcst_" }}{{ "ens" if (global.NUM_ENS_MEMBERS > 0) else "det" }}{{ "/{{workflow.PREDEF_GRID_NAME}}" }}{% raw %}{% endraw %}'
  EXTRN_MDL_DATA_STORES: hpss aws nomads

