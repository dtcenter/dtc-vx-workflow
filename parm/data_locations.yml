    protocol: awscli
    # Data description including repositories/buckets can be found in
    # https://www.ncei.noaa.gov/access/metadata/landing-page/bin/iso?id=gov.noaa.ncdc:C01511
    #
    # Product descriptions can be found in https://www.goes-r.gov/products/docs/PUG-L2+-vol5.pdf
    # File names specifically in Appendix A
    bucket:
      - "s3://noaa-goes16/ABI-L2-AODF/{fyyyy}/{fjjj}/{fhh}" # AOD obs
    file_names:
      - "OR_ABI-L2-AODF-M[3-6]_G16_s{fyyyy}{fjjj}{fhh}*.nc"

