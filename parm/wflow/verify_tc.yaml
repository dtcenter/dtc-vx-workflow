default_task_tc: &default_task_tc
  account: '&ACCOUNT;'
  attrs: &default_attrs
    cycledefs: forecast
    maxtries: 1
  envars: &default_vars
    GLOBAL_VAR_DEFNS_FP: '&GLOBAL_VAR_DEFNS_FP;'
    USHdir: '&USHdir;'
    YYMMDD:
      cyclestr:
        value: '@Y@m@d'
    HH:
      cyclestr:
        value: '@H'
    LOGDIR:
      cyclestr:
        value: '&LOGDIR;'
    MET_INSTALL_DIR: '&MET_INSTALL_DIR;'
    METPLUS_ROOT: '&METPLUS_ROOT;'
    nprocs: '{{ verification_resources.execution.nodes * tcpairs.execution.tasks_per_node }}'
  join:
    cyclestr:
      value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H&LOGEXT;'
  native: '{{ platform.SCHED_NATIVE_CMD }}'
  partition: '{{ "&PARTITION_DEFAULT;" if platform.get("PARTITION_DEFAULT") }}'
  queue: '&QUEUE_DEFAULT;'

task_tcpairs:
  <<: *default_task_tc
  command: "&JOBSdir;/TCPAIRS.sh"
  envars:
    <<: *default_vars
    USHdir: '&USHdir;'
    CYCLE_DATE:
      cyclestr:
        value: '@Y@m@d@H'
  memory: '{{  tcpairs.execution.memory if user.MACHINE not in ["NOAACLOUD"] }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ tcpairs.execution.tasks_per_node }}'
  walltime: "{{ tcpairs.execution.walltime }}"

task_tcstat:
  <<: *default_task_tc
  command: "&JOBSdir;/TCSTAT.sh"
  envars:
    <<: *default_vars
    USHdir: '&USHdir;'
    CYCLE_DATE:
      cyclestr:
        value: '@Y@m@d@H'
  memory: '{{  tcstat.execution.memory if user.MACHINE not in ["NOAACLOUD"] }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ tcstat.execution.tasks_per_node }}'
  walltime: "{{ tcstat.execution.walltime }}"
  dependency:
    taskdep:
      attrs:
        task: tcpairs

task_tcrmw:
  <<: *default_task_tc
  command: "&JOBSdir;/TCRMW.sh"
  envars:
    <<: *default_vars
    USHdir: '&USHdir;'
    CYCLE_DATE:
      cyclestr:
        value: '@Y@m@d@H'
  memory: '{{  tcrmw.execution.memory if user.MACHINE not in ["NOAACLOUD"] }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ tcrmw.execution.tasks_per_node }}'
  walltime: "{{ tcrmw.execution.walltime }}"
  dependency:
    taskdep:
      attrs:
        task: tcstat

