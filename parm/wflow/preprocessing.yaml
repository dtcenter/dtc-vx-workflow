metatask_check_fcst_files_all_mems:
  var:
    mem: '{% for m in range(ensemble.ENSMEM_INDX_MIN, ensemble.ENSMEM_INDX_MAX+1) %}{{ "%03d "%m }}{%- endfor -%}'
  task_check_fcst_files_mem#mem#:
    <<: *default_task_preprocessing
    attrs:
      cycledefs: forecast
      maxtries: 1
    command: "&JOBSdir;/CHECK_FCST_FILES.sh"
    envars:
      <<: *default_vars
      ENSMEM_INDX: '#mem#'
    walltime: "{{ verification_resources.execution.check_fcst_files.walltime }}"

