  var:
    ACCUM_HH: '{% for ah in verification.VX_APCP_ACCUMS_HRS %}{% if workflow.FCST_LEN_HRS >= ah %}{{ "%02d " % ah }}{% endif %}{% endfor %}'
  metatask_PcpCombine_APCP#ACCUM_HH#h_all_mems:
    var:
      mem: '{% for m in range(ensemble.ENSMEM_INDX_MIN, ensemble.ENSMEM_INDX_MAX+1) %}{{ "%03d "%m }}{%- endfor -%}'
    task_run_MET_PcpCombine_APCP#ACCUM_HH#h_fcst_mem#mem#:
      <<: *default_task_preprocessing
      attrs:
        cycledefs: forecast
        maxtries: 2
      command: "&JOBSdir;/PCPCOMBINE.sh"
      walltime: "{{ verification_resources.execution.pcpcombine.fcst.walltime }}"
      envars:
        <<: *default_vars
        FIELD_GROUP: 'APCP'
        ACCUM_HH: '#ACCUM_HH#'
        FCST_OR_OBS: FCST
        OBTYPE: CCPA
        OBS_DIR: '&CCPA_OBS_DIR;'
        METPLUSTOOLNAME: 'PCPCOMBINE'
        ENSMEM_INDX: "#mem#"
      dependency:
        datadep:
          attrs:
            age: 00:00:00:30
          value:
            cyclestr:
              value: '{{ workflow.EXPTDIR }}/@Y@m@d@H/fcst_files_exist_mem#mem#.txt'

