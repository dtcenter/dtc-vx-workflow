default_task_mode: &default_task_mode
  attrs: &default_attrs
    cycledefs: forecast
    maxtries: '1'
  envars: &default_vars
    GLOBAL_VAR_DEFNS_FP: '&GLOBAL_VAR_DEFNS_FP;'
    USHdir: '&USHdir;'
    YYMMDD:
      cyclestr:
        value: '@Y@m@d'
    HH:
      cyclestr:
        value: '@H'
    LOGDIR:
      cyclestr:
        value: '&LOGDIR;'
    MET_INSTALL_DIR: '&MET_INSTALL_DIR;'
    METPLUS_ROOT: '&METPLUS_ROOT;'
  join:
    cyclestr:
      value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H&LOGEXT;'
  native: '{{ platform.SCHED_NATIVE_CMD }}'
  partition: '{{ "&PARTITION_DEFAULT;" if platform.get("PARTITION_DEFAULT") }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ verification_resources.execution.tasks_per_node }}'
  queue: '&QUEUE_DEFAULT;'

task_run_RegridDataPlane_GOESAOD:

  <<: *default_task_mode
  attrs:
    <<: *default_attrs
  command: "&JOBSdir;/REGRIDDATAPLANE.sh"
  envars:
    <<: *default_vars
    FIELD_GROUP: 'GOESAOD'
    OBTYPE: 'GOESAOD'
  memory: '{{ regriddataplane.execution.memory if user.MACHINE not in ["NOAACLOUD"] }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ regriddataplane.execution.tasks_per_node }}'
  walltime: "{{ regriddataplane.execution.walltime }}"
  dependency:
    taskdep:
      attrs:
        task: 'run_MET_Point2Grid_GOESAOD'

task_run_MODE_GOESAOD:

  <<: *default_task_mode
  attrs:
    <<: *default_attrs
  command: "&JOBSdir;/MODE.sh"
  envars:
    <<: *default_vars
    FIELD_GROUP: 'GOESAOD'
    OBTYPE: 'GOESAOD'
    OMP_NUM_THREADS: 4
  memory: '{{  mode.execution.memory if user.MACHINE not in ["NOAACLOUD"] }}'
  nodes: '{{ verification_resources.execution.nodes }}:ppn={{ mode.execution.tasks_per_node }}'
  walltime: "{{ mode.execution.walltime }}"
  dependency:
    taskdep:
      attrs:
        task: 'run_RegridDataPlane_GOESAOD'
