#
# The defaults that cover a majority of our workflow test experiments.
#
rocoto:
  entities:
    ACCOUNT: '{{ user.ACCOUNT }}'
    AERONET_OBS_DIR: '{{ verification.AERONET_OBS_DIR }}'
    AIRNOW_OBS_DIR: '{{ verification.AIRNOW_OBS_DIR }}'
    CCPA_OBS_DIR: '{{ verification.CCPA_OBS_DIR }}'
    COLDSTART: '{{ workflow.COLDSTART }}'
    COMINgfs: '{{ platform.get("COMINgfs") }}'
    GLOBAL_VAR_DEFNS_FP: '{{ workflow.GLOBAL_VAR_DEFNS_FP }}'
    GOESAOD_OBS_DIR: '{{ verification.GOESAOD_OBS_DIR }}'
    HOMEdir: '{{ user.HOMEdir }}'
    JOBSdir: '{{ user.JOBSdir }}'
    LOAD_MODULES_RUN_TASK: '{{ workflow.LOAD_MODULES_RUN_TASK_FP }} {{ user.MACHINE }}'
    LOGEXT: ".log"
    MRMS_OBS_DIR: '{{ verification.MRMS_OBS_DIR }}'
    NCORES_PER_NODE: '{{ platform.NCORES_PER_NODE }}'
    NDAS_OBS_DIR: '{{ verification.NDAS_OBS_DIR }}'
    NOHRSC_OBS_DIR: '{{ verification.NOHRSC_OBS_DIR }}'
    PARTITION_DEFAULT: '{{ platform.get("PARTITION_DEFAULT") }}'
    PARTITION_FCST: '{{ platform.get("PARTITION_FCST") }}'
    PARTITION_HPSS: '{{ platform.get("PARTITION_HPSS") }}'
    QUEUE_DEFAULT: '{{ platform.get("QUEUE_DEFAULT") }}'
    QUEUE_FCST: '{{ platform.get("QUEUE_FCST") }}'
    QUEUE_HPSS: '{{ platform.get("QUEUE_HPSS") }}'
    SCRIPTSdir: '{{ user.SCRIPTSdir }}'
    SLASH_ENSMEM_SUBDIR: '{{ "/mem#mem#" if global.DO_ENSEMBLE else "/" }}'
    USHdir: '{{ user.USHdir }}'
    WARMSTART_CYCLE_DIR: '{{ workflow.WARMSTART_CYCLE_DIR }}'
    WORKFLOW_ID: '{{ workflow.WORKFLOW_ID }}'

    COMIN_DIR: '{{ workflow.EXPTDIR + "/@Y@m@d@H" }}'
    FCST_DIR: '{{ workflow.EXPTDIR + "/@Y@m@d@H" }}'
    LOGDIR: '{{ workflow.EXPTDIR + "/log" }}'
  attrs:
    cyclethrottle: !int '{{ platform.CYCLETHROTTLE }}'
    realtime: false
    scheduler: '{{ platform.SCHED }}'
    taskthrottle: !int '{{ platform.TASKTHROTTLE }}'
  cycledef:
    - attrs:
        group: at_start
      spec: '{{ workflow.DATE_FIRST_CYCL }}00 {{ workflow.DATE_FIRST_CYCL }}00 {{ workflow.INCR_CYCL_FREQ }}:00:00'
    - attrs:
        group: forecast
      spec: '{{ workflow.DATE_FIRST_CYCL }}00 {{ workflow.DATE_LAST_CYCL }}00 {{ workflow.INCR_CYCL_FREQ }}:00:00'
    - attrs:
        group: at_end
      spec: '{{ workflow.DATE_LAST_CYCL }}00 {{ workflow.DATE_LAST_CYCL }}00 {{ workflow.INCR_CYCL_FREQ }}:00:00'
  log:
    cyclestr:
      value: '&LOGDIR;/FV3LAM_wflow.log'
