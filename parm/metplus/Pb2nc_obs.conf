# Pb2nc METplus Configuration

[config]

# List of applications (tools) to run.
PROCESS_LIST = PB2NC

# time looping - options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
LOOP_BY = INIT

# Format of INIT_BEG and INIT_END using % items
# %Y = 4 digit year, %m = 2 digit month, %d = 2 digit day, etc.
# see www.strftime.org for more information
# %Y%m%d%H expands to YYYYMMDDHH
INIT_TIME_FMT = %Y%m%d%H

# Start time for METplus run - must match INIT_TIME_FMT
INIT_BEG = {{cdate}}

# End time for METplus run - must match INIT_TIME_FMT
INIT_END = {{cdate}}

# Increment between METplus runs (in seconds if no units are specified).
# Must be >= 60 seconds.
INIT_INCREMENT = 3600

# List of forecast leads to process for each run time (init or valid)
# In hours if units are not specified
# If unset, defaults to 0 (don't loop through forecast leads)
LEAD_SEQ = {{vx_leadhr_list}}
#
# Verbosity of MET logging output.  0 to 5; 0 is quiet, 5 is loud.
#
LOG_{{METPLUS_TOOL_NAME}}_VERBOSITY = {{metplus_verbosity_level}}
#
# Specify the name of the METplus log file.
#
LOG_METPLUS = {LOG_DIR}/{{metplus_log_fn}}
#
# Specify the location and name of the final METplus conf file.
#
METPLUS_CONF = {PB2NC_OUTPUT_DIR}/metplus_final.{{metplus_config_fn}}
#
# Location of MET configuration file to pass to Pb2nc.
#
# References PARM_BASE, which is the location of the parm directory
# corresponding to the ush directory of the run_metplus.py script that
# is called or the value of the environment variable METPLUS_PARM_BASE
# if set.
#
PB2NC_CONFIG_FILE = {PARM_BASE}/met_config/PB2NCConfig_wrapped
#
# Name to identify observation data in output.
#
OBTYPE = {{obtype}}
#
# Obs-type dependent settings.
#
{%- if (obtype == 'GDAS') %}

# The following GDAS settings follow those used in the DTC's global
# (GFS vs. GDAS) verification setup.  Compared to the NDAS settings, they
# use a wider time window, keep all message types (e.g. including SFCSHP
# marine surface obs), and use a GDAS-specific set of report types (e.g.
# including surface reports with missing station and sea-level pressures).
# (Unlike in that setup, the quality mark threshold is set to 9 below.)
PB2NC_OBS_WINDOW_BEGIN = -2700
PB2NC_OBS_WINDOW_END = 2700

PB2NC_LEVEL_CATEGORY = 0, 1, 4, 6
PB2NC_PB_REPORT_TYPE = 120, 122, 132, 180, 181, 182, 183, 187, 192, 193, 194, 220, 221, 222, 232, 280, 281, 282, 284, 287, 292, 293, 294
PB2NC_MESSAGE_TYPE =

{%- elif (obtype == 'NDAS') %}

PB2NC_OBS_WINDOW_BEGIN = -1799
PB2NC_OBS_WINDOW_END = 1800

PB2NC_LEVEL_CATEGORY = 0, 1, 4, 5, 6
PB2NC_PB_REPORT_TYPE = 120, 220, 221, 122, 222, 223, 224, 131, 133, 233, 153, 156, 157, 188, 288, 180, 280, 181, 182, 281, 282, 183, 284, 187, 287
PB2NC_MESSAGE_TYPE = ADPSFC, ADPUPA

{%- else %}

{%- include 'ERROR: No PB2NC settings are defined in Pb2nc_obs.conf for obtype "' ~ obtype ~ '"' %}

{%- endif %}

# Maximum PREPBUFR quality mark of observations to retain.  PB2NC keeps
# observations whose quality mark is less than or equal to this value.
# Lower quality marks indicate better data (see Table 7 of the NCEP
# PREPBUFR documentation):
#
#   0      Keep (always assimilate).
#   1      Good.
#   2      Neutral or not checked (the default).
#   3      Suspect.
#   4-7    Flagged by the analysis' quality control (rejected).
#   8      Rejected by the PREVENT or VIRTMP checks (e.g. a failed limit
#          check).
#   9      Not used, but monitored, by the analysis (e.g. because of a
#          missing observation error).
#   10-14  Rejected by other checks or by NCEP Senior Duty Meteorologists.
#   15     Flagged by PREPRO for non-use by the analysis.
#
# Observations with quality marks 0-3 are used by the analysis; those
# with 4-15 are not.  A value of 9 is used here because observations with
# quality mark 9 are generally valid but are not used by the analysis.
# For example, in the GDAS PREPBUFR files of mid-2024, nearly all land
# surface (ADPSFC) temperature, dew point, wind, and sea-level pressure
# observations have quality mark 9 (and the rest 8), so a threshold of 3
# would remove all of them.  Observations with quality marks 4-8 are then excluded from
# verification by the OBS_QUALITY_INC setting of the PointStat tasks.
PB2NC_QUALITY_MARK_THRESH = 9

# Leave empty to process all.
PB2NC_OBS_BUFR_VAR_LIST = PMO, ZOB, TOB, D_DPT, POB, QOB, UOB, VOB, PWO, TOCC, D_RH, HOVI, CEILING, D_PBL, D_CAPE, D_MLCAPE, MXGS, D_WIND, D_PRMSL, PRWE

# If set to True, skip run if the output file determined by the output
# directory and filename template already exists.
#PB2NC_SKIP_IF_OUTPUT_EXISTS = True
# Can remove the following line if default is False; not sure what the
# default is.
PB2NC_SKIP_IF_OUTPUT_EXISTS = False

# Values to pass to Pb2nc config file using environment variables of the same name.
PB2NC_GRID = 
PB2NC_POLY =
PB2NC_STATION_ID =

# Mapping of input BUFR variable names to output variables names.
# The default PREPBUFR map, obs_prepbufr_map, is appended to this map.
PB2NC_OBS_BUFR_MAP = [{ key = "PWO"; val = "PWAT"; },{ key = "MXGS"; val = "GUST"; }, { key = "CEILING"; val = "CEILING"; }]

# For defining the time periods for summarization
# False for no time summary, True otherwise
# The rest of the PB2NC_TIME_SUMMARY variables are ignored if set to False
PB2NC_TIME_SUMMARY_FLAG = False
PB2NC_TIME_SUMMARY_BEG = 000000
PB2NC_TIME_SUMMARY_END = 235959
PB2NC_TIME_SUMMARY_VAR_NAMES = PMO,TOB,TDO,UOB,VOB,PWO,TOCC
PB2NC_TIME_SUMMARY_TYPES = min, max, range, mean, stdev, median, p80

# End of [config] section and start of [dir] section
[dir]
#
# Directory containing (observation) input to Pb2nc.
#
PB2NC_INPUT_DIR = {{obs_input_dir}}
#
# Directory in which to write output from Pb2nc.
#
# OUTPUT_BASE apparently has to be set to something; it cannot be left
# to its default value.  But it is not explicitly used elsewhere in this
# configuration file.
#
OUTPUT_BASE = {{output_dir}}
PB2NC_OUTPUT_DIR = {{output_dir}}

# End of [dir] section and start of [filename_templates] section.
[filename_templates]
#
# Template for prepbufr input to Pb2nc relative to PB2NC_INPUT_DIR.
#
PB2NC_INPUT_TEMPLATE = {{obs_input_fn_template}}
#
# Template for the name of the output file generated by Pb2nc, relative
# to PB2NC_OUTPUT_DIR.  This can contain subdirectories and time tags.
#
PB2NC_OUTPUT_TEMPLATE = {{output_fn_template}}
