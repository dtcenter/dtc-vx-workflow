#
# Verification masks.  Unlike Grid-Stat and Point-Stat, MODE takes at most
# one grid and one mask file, not lists, and uses them to set all the grid
# points outside the masked region to missing data, which limits the area
# in which MODE defines objects.  See the descriptions of the "mask" config
# entry for MODE and for MET tools in general in the MET User's Guide.
#
# The METplus config variable MODE_MASK_GRID sets the MET config entry
# mask.grid, a single grid.  This is usually a grid defined in MET's code,
# not in a file: FULL (the whole verification domain) or an NCEP grid named
# GNNN, where NNN is the 3-digit NCEP grid number (e.g. G212).  It can also
# be a gridded data file, in which case the region is that file's grid.
# The workflow does not set MODE_MASK_GRID (it is commented out below).
#
# The METplus config variable MODE_MASK_POLY sets the MET config entry
# mask.poly, a single file that defines a verification mask.  The workflow
# can pass two types of mask files to it: (1) a lat/lon polygon (.poly)
# file, or (2) a gridded mask file such as a NetCDF file made by MET's
# gen_vx_mask tool.  The file can be user-defined (in VX_MASK_DIR), one
# that comes with the workflow (in parm/metplus/vx_masks), or one that
# comes with MET (in share/met/poly).  The workflow sets MODE_MASK_POLY
# (and thus mask.poly) to the file for the mask listed in VX_MASKS.  Since
# MODE takes a single file, VX_MASKS should list at most one mask when MODE
# is run.
#
# The METplus config variables MODE_MASK_GRID_FLAG and MODE_MASK_POLY_FLAG
# set the MET config entries mask.grid_flag and mask.poly_flag, which set
# whether each mask is applied to the forecast field (FCST), the
# observation field (OBS), BOTH, or NONE.
#
# MODE_MASK_GRID and MODE_MASK_POLY are the primary METplus config
# variables for mask.grid and mask.poly, respectively.  METplus also
# accepts other variables (aliases) that set mask.grid and mask.poly, but
# here, for clarity, we only use the primary variables.  If more than one
# METplus config variable for the same MET config entry is set (i.e. the
# primary variable and/or one or more aliases), METplus uses only one of
# them and ignores the others; their values are not combined, and which of
# these different variables comes first in the METplus config file does
# not matter (but see below if the same variable is set more than once).
# METplus uses the first variable that is set in the following order:
#
# - mask.grid:
#   1) MODE_MASK_GRID
#   2) MODE_GRID
# - mask.poly:
#   1) MODE_MASK_POLY
#   2) MODE_VERIFICATION_MASK_TEMPLATE
#   3) MODE_POLY
#
# For example, METplus first looks for MODE_MASK_POLY in the config files.
# If it is set, METplus passes its value to mask.poly and ignores
# MODE_VERIFICATION_MASK_TEMPLATE and MODE_POLY.  If not, METplus looks for
# MODE_VERIFICATION_MASK_TEMPLATE, and if that is set, passes its value to
# mask.poly and ignores MODE_POLY.  Otherwise, it passes the value of
# MODE_POLY, if set, to mask.poly.
#
# A variable counts as set even if its value is empty: e.g. if
# MODE_MASK_POLY is set to nothing and MODE_POLY to a file, METplus uses
# MODE_MASK_POLY and ignores MODE_POLY.  Since MODE_MASK_POLY is empty,
# METplus then passes nothing to mask.poly, so MET uses its default (no
# mask; see below) and the file is ignored.
#
# (If the same variable is set more than once, e.g. in two lines of one
# config file or in two config files, METplus uses the last value it reads
# and ignores the earlier ones.  This happens before the order above is
# applied.)
#
# If none of the METplus config variables for a MET config entry is set,
# METplus does not pass that entry to MET, and MET uses the value in its own
# default config file for MODE (share/met/config/MODEConfig_default), which
# is mask.grid = "" and mask.poly = "" (no mask), with mask.grid_flag and
# mask.poly_flag set to NONE.
#
#MODE_MASK_GRID =
#MODE_MASK_GRID_FLAG =
MODE_MASK_POLY = {{vx_mask_files}}
MODE_MASK_POLY_FLAG = BOTH

