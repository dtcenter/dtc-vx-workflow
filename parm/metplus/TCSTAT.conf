[config]

# Documentation for this use case can be found at
# https://metplus.readthedocs.io/en/latest/generated/model_applications/tc_and_extra_tc/TCPairs_TCStat_fcstADECK_obsBDECK_ATCF_BasicExample.html

# For additional information, please see the METplus Users Guide.
# https://metplus.readthedocs.io/en/latest/Users_Guide

###
# Processes to run
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#process-list
###

PROCESS_LIST = TCStat


###
# Time Info
# LOOP_BY options are INIT, VALID, RETRO, and REALTIME
# If set to INIT or RETRO:
#   INIT_TIME_FMT, INIT_BEG, INIT_END, and INIT_INCREMENT must also be set
# If set to VALID or REALTIME:
#   VALID_TIME_FMT, VALID_BEG, VALID_END, and VALID_INCREMENT must also be set
# LEAD_SEQ is the list of forecast leads to process
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#timing-control
###

LOOP_BY = INIT
INIT_TIME_FMT = %Y%m%d%H
INIT_BEG = {{cdate}}
INIT_END = {{cdate}}
MODEL = {{model}}

###
# File I/O
# https://metplus.readthedocs.io/en/latest/Users_Guide/systemconfiguration.html#directory-and-filename-template-info
###

# TCStat

OUTPUT_BASE = {{output_dir}}
TC_STAT_LOOKIN_DIR = {{tcpairs_output}}
TC_STAT_OUTPUT_DIR = {OUTPUT_BASE}


METPLUS_CONF = {TC_STAT_OUTPUT_DIR}/metplus_final.{{cdate}}.TCSTAT.conf
LOG_TC_STAT_VERBOSITY = {{metplus_verbosity_level}}
#LOG_LEVEL = {{log_level}}
LOG_METPLUS = {LOG_DIR}/{{metplus_log_fn}}

###
# TCStat Settings
# https://metplus.readthedocs.io/en/latest/Users_Guide/wrappers.html#tcstat
###

TC_STAT_LINE_TYPE = TCMPR
TC_STAT_BASIN = {{basin}}
TC_STAT_CYCLONE = {{storm_id}}
cyclone={TC_STAT_CYCLONE}

TC_STAT_COLUMN_STRING_NAME = LEVEL
TC_STAT_COLUMN_STRING_VAL = HU,SD,SS,TS,TD

TC_STAT_WATER_ONLY = FALSE

TC_STAT_JOB_ARGS = -job filter -dump_row {TC_STAT_OUTPUT_DIR}/{{summary_file}} -job rirw -rirw_track BOTH -rirw_exact TRUE -rirw_thresh ge30 -out_stat {TC_STAT_OUTPUT_DIR}/{{ri_file}}
#TC_STAT_JOB_ARGS = -job summary -line_type TCMPR  -column TK_ERR -dump_row {TC_STAT_OUTPUT_DIR}/tc_summary_job.tcst
